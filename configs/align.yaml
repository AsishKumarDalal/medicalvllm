# configs/align.yaml — Stage 1: connector-only alignment on ROCOv2 captions
llm_checkpoint: ../minillm/sft_checkpoints/sft_model.pt   # normal SFT, NOT tool-calling
hf_fallback: {repo: sddfhy546y/minillm, filename: sft_model.pt}
data:
  dataset: eltorio/ROCOv2-radiology   # verify id at P0; fallbacks in data/captions.py
  radiology_only: true
  shuffle_buffer: 500
freeze_llm: true
batch_size: 32
grad_accum_steps: 2
learning_rate: 1.0e-4
warmup_steps: 200
epochs: 2
hours: 4
grad_clip: 1.0
checkpoint_interval_minutes: 60
checkpoint_dir: checkpoints/align
out_dir: outs/align
hf: {enabled: false}
